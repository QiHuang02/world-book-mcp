name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish package to npm
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_TAG="${VERSION#*-}"
            PRERELEASE_TAG="${PRERELEASE_TAG%%.*}"
            npm publish --access public --tag "$PRERELEASE_TAG"
          else
            npm publish --access public
          fi

  release-skill:
    name: Package skill and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_NAME="v${VERSION}"
          ZIP_NAME="world-book-mcp-skill-v${VERSION}.zip"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package skill as zip
        shell: bash
        run: |
          mkdir -p release-assets
          cd skill
          zip -r "../release-assets/${{ steps.version.outputs.zip_name }}" world-book-mcp

      - name: Publish skill zip to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/${{ steps.version.outputs.zip_name }}
